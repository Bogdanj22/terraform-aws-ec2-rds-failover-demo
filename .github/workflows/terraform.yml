name: Terraform CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      MY_IP: ${{ secrets.MY_IP }}
      SSH_KEY_NAME: ${{ secrets.SSH_KEY_NAME }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # - name: Create terraform.tfvars from secrets
      #   run: |
      #     echo "my_ip = \"${{ env.MY_IP }}\"" > terraform.tfvars
      #     echo "ssh_key_name = \"${{ env.SSH_KEY_NAME }}\"" >> terraform.tfvars
      #     echo "db_name = \"${{ env.DB_NAME }}\"" >> terraform.tfvars
      #     echo "db_password = \"${{ env.DB_PASSWORD }}\"" >> terraform.tfvars

      - name: Terraform Plan
        # run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
